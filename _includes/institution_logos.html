{% comment %}
  Same two marks as palmigianolab.com, top right. The UCL logo is single-colour
  so the lab site ships light and dark variants; this site is light only, so it
  uses the light one.
{% endcomment %}
<div class="institution-logos">
  <a href="https://www.ucl.ac.uk" title="University College London">
    <img src="{{ '/assets/img/ucl_logo_light.png' | relative_url }}" alt="University College London" loading="lazy">
  </a>
  <a href="https://www.gatsby.ucl.ac.uk" title="Gatsby Computational Neuroscience Unit">
    <img class="logo-gatsby" src="{{ '/assets/img/gatsby_logo.png' | relative_url }}" alt="Gatsby Computational Neuroscience Unit" loading="lazy">
  </a>
</div>
