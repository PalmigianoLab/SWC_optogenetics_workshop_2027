<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" width="1500" height="620" role="img"
     aria-label="A laser delivered through an optical fibre into the head of a mouse, over equations from the Palmigiano and Chau papers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0a2422"/><stop offset="58%" stop-color="#061618"/>
      <stop offset="100%" stop-color="#03090c"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffe9c4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="spot">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="22%" stop-color="#fff0d2" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#e8a04a" stop-opacity="0.28"/><stop offset="100%" stop-color="#e8a04a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brainGlow">
      <stop offset="0%" stop-color="#ffe2ae" stop-opacity="0.8"/><stop offset="100%" stop-color="#e8a04a" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-60%" y="-300%" width="220%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="bloomBig" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <!-- one rim light around the whole silhouette, so the shapes read as one animal -->
    <filter id="rim" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#7fd4c1" flood-opacity="0.75"/>
    </filter>
    <style>
      .eq  { fill:#8fd8c6; font-family:"Iowan Old Style",Palatino,Georgia,serif; font-style:italic; opacity:0.30; }
      .eq2 { fill:#8fd8c6; font-family:"Iowan Old Style",Palatino,Georgia,serif; font-style:italic; opacity:0.20; }
    </style>
  </defs>

  <rect width="1500" height="620" fill="url(#bg)"/>

  <!-- Palmigiano & Fumarola et al.; Chau, Miller & Palmigiano -->
  <g>
    <text class="eq" x="60" y="78" font-size="26">r = f(Wr + h)</text>
    <text class="eq" x="420" y="78" font-size="26">L := (I − GW)⁻¹</text>
    <text class="eq" x="820" y="72" font-size="24">δr ≈ LG δh</text>
    <text class="eq2" x="1150" y="72" font-size="20">G := diag( f′(v*) )</text>
    <text class="eq2" x="60" y="214" font-size="19">δr ≈ L δh′ + L δG δv + L H(δv)°²</text>
    <text class="eq2" x="1090" y="176" font-size="19">δr ≈ L( I − δG W L )⁻¹ δh′</text>
    <text class="eq" x="60" y="360" font-size="24">χᵅᵅ = k&#8337; det(−J&#8337;)</text>
    <text class="eq2" x="60" y="452" font-size="19">τ ∂&#8348; r = −r + f(Wr + h)</text>
    <text class="eq" x="60" y="556" font-size="22">I&#8347; / I&#7515; = f′&#7515; ω&#738;&#7515;</text>
    <text class="eq2" x="430" y="556" font-size="19">Σ&#11388;&#8712;&#8321; L&#7522;&#11388; H&#11388;&#11388; δv&#11388;²</text>
    <text class="eq2" x="820" y="590" font-size="18">ΔE = χ&#7431;&#7431; I&#7431; + χ&#7431;&#7510; I&#7510; + χ&#7431;&#738; I&#738;</text>
    <text class="eq2" x="1180" y="556" font-size="18">G&#7511;&#7517; = G&#738;&#7510;&#7491;&#7580;&#7497; · G&#7433;&#691;&#8305;</text>
  </g>

  <!-- laser in from the left, objective, then fibre down to the implant -->
  <g>
    <rect x="0" y="132" width="360" height="22" fill="url(#ray)" opacity="0.2" filter="url(#bloom)"/>
    <rect x="0" y="140" width="366" height="6" fill="url(#ray)" filter="url(#soft)"/>
    <rect x="0" y="142" width="366" height="2" fill="#ffffff"/>
    <g transform="translate(388 143)">
      <ellipse rx="20" ry="58" fill="#0b2a2c" stroke="#7fd4c1" stroke-width="2" stroke-opacity="0.7"/>
      <ellipse rx="10" ry="45" fill="none" stroke="#e8a04a" stroke-width="1.3" stroke-opacity="0.5"/>
      <rect x="-34" y="-66" width="14" height="132" rx="4" fill="#0b2a2c" stroke="#7fd4c1" stroke-width="1.5" stroke-opacity="0.5"/>
    </g>
    <path d="M406 143 C 600 143, 660 200, 762 292" stroke="#7fd4c1" stroke-width="7" fill="none" stroke-opacity="0.3" stroke-linecap="round"/>
    <path d="M406 143 C 600 143, 660 200, 762 292" stroke="#ffe9c4" stroke-width="2.4" fill="none" stroke-opacity="0.9" filter="url(#soft)" stroke-linecap="round"/>
    <rect x="752" y="280" width="20" height="40" rx="4" fill="#0b2a2c" stroke="#7fd4c1" stroke-width="1.6" stroke-opacity="0.75"/>
  </g>

  <!-- the mouse: overlapping solid shapes, one rim light, no internal seams -->
  <g filter="url(#rim)">
    <g fill="#0f3230">
      <ellipse cx="1010" cy="410" rx="215" ry="112" transform="rotate(-5 1010 410)"/>
      <circle cx="1170" cy="404" r="112"/>                     <!-- haunch -->
      <ellipse cx="812" cy="360" rx="96" ry="76" transform="rotate(-16 812 360)"/>  <!-- head -->
      <path d="M732 372 C 700 372, 682 388, 686 402 C 692 416, 722 420, 754 410 Z"/> <!-- snout -->
      <circle cx="846" cy="292" r="40"/>                        <!-- ear -->
      <path d="M900 480 C 894 522, 906 542, 934 546 L 972 546 C 950 528, 942 502, 944 476 Z"/>
      <path d="M1150 486 C 1146 528, 1162 548, 1194 552 L 1236 552 C 1210 532, 1200 506, 1200 480 Z"/>
    </g>
    <circle cx="846" cy="292" r="21" fill="#17453f"/>
  </g>
  <!-- tail, eye, nose -->
  <path d="M1276 428 C 1350 424, 1396 462, 1390 508 C 1384 548, 1350 566, 1312 562"
        fill="none" stroke="#7fd4c1" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <circle cx="774" cy="348" r="8" fill="#ffe7bd"/>
  <circle cx="690" cy="396" r="5" fill="#f5b98a"/>
  <g stroke="#7fd4c1" stroke-opacity="0.3" stroke-width="1.2" fill="none">
    <path d="M690 390 C 646 372, 618 366, 590 366"/>
    <path d="M690 398 C 646 396, 616 400, 588 406"/>
    <path d="M692 406 C 654 420, 632 434, 614 448"/>
  </g>

  <!-- the light going in, and spreading under the skull -->
  <g>
    <path d="M762 318 L830 440 L696 440 Z" fill="url(#spot)" opacity="0.7" filter="url(#soft)"/>
    <circle cx="762" cy="322" r="66" fill="url(#spot)" filter="url(#bloomBig)"/>
    <ellipse cx="790" cy="366" rx="80" ry="58" fill="url(#brainGlow)" filter="url(#bloomBig)" opacity="0.75"/>
    <circle cx="762" cy="320" r="6" fill="#ffffff"/>
  </g>

  <rect width="1500" height="620" fill="url(#bg)" opacity="0.16"/>
  <rect y="516" width="1500" height="104" fill="#03090c" opacity="0.4"/>
</svg>
