name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *" # daily, to pick up confirmations from the sheet

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh from the spreadsheet 📋
        # --allow-stale: a Google outage or a changed sheet layout keeps the
        # committed lists rather than publishing an empty page.
        run: |
          python3 scripts/people_from_sheet.py --allow-stale
          python3 scripts/make_schedule.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build 🔧
        env:
          JEKYLL_ENV: production
        # base_path is "" on a custom domain and "/<repo>" on a project page,
        # so the same workflow works either way.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
