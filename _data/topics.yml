# Draft, written from Agostina's brief — replace with your own wording.
- title: Theory meets experiment
  body: >-
    The combinatorial complexity of manipulations of neural activity at
    single-neuron resolution creates a challenge to interpret it. The workshop
    puts the people manipulating neural activity and the people modelling what
    they do in one room, for three days
- title: New collaborations
  body: >-
    Three days together, with a poster session and a dinner alongside the talks.
    The goal is to start new collaborations, and for everyone to leave with a
    clearer understanding of where the field currently stands.
