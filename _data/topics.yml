# Draft, written from Agostina's brief — replace with your own wording.
- title: Theory meets experiment
  body: >-
    Targeted manipulation of activity has outrun our ability to interpret it.
    The workshop puts the people building the tools and the people modelling
    what they do in one room, for three days, deliberately.
- title: A review of the state of the art
  body: >-
    We intend to leave with the skeleton of a review article on where
    optogenetic perturbation now stands — what it can establish, what it
    cannot, and which disagreements are real rather than terminological.
- title: New collaborations
  body: >-
    Long breaks, small rooms, and a deliberately mixed guest list across
    species and methods. Much of the programme is unstructured time, which is
    where the collaborations actually start.
